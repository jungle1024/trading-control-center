<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Global Trading Control Center</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233b82f6'/><path d='M7 22l6-7 5 4 7-9' stroke='white' stroke-width='3' fill='none'/></svg>">
<style>
:root{--bg:#0d1117;--panel:#151b23;--panel2:#1b222c;--line:#283140;--tx:#e6ebf1;--mut:#8b96a6;--dim:#5d6878;
--ok:#22c55e;--warn:#f59e0b;--fail:#ef4444;--idle:#64748b;--blue:#60a5fa;--bull:#22c55e;--bear:#ef4444;--p1:#ef4444;--p2:#f59e0b;--p3:#60a5fa;--p4:#64748b}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:5;background:rgba(13,17,23,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{max-width:1320px;margin:0 auto;padding:12px 20px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hd h1{font-size:17px;margin:0;letter-spacing:-.2px}.hd h1 small{display:block;font-size:11.5px;color:var(--mut);font-weight:500}
.hd .sp{flex:1}.clock{color:var(--mut);font-size:12.5px;text-align:right;line-height:1.35}.clock b{color:var(--tx);font-weight:600}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}.btn:hover{border-color:#3b4656}
.btn.sm{padding:3px 9px;font-size:12px}
nav{max-width:1320px;margin:0 auto;padding:6px 20px 0;display:flex;gap:2px;overflow-x:auto}
nav a{color:var(--mut);padding:9px 14px;border-bottom:2px solid transparent;white-space:nowrap;font-weight:600;font-size:13.5px}
nav a.on{color:var(--tx);border-color:var(--blue)}nav a:hover{text-decoration:none;color:var(--tx)}
nav a .cnt{background:var(--fail);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:5px}
main{max-width:1320px;margin:0 auto;padding:18px 20px 60px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
@media(max-width:980px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:680px){.g2,.g3,.g4{grid-template-columns:1fr}.hd .clock{text-align:left}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.card h2{font-size:13px;margin:0 0 12px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:8px;letter-spacing:.2px}
.card h2 .no{color:var(--dim);font-variant-numeric:tabular-nums}.card h2 .r{margin-left:auto;font-weight:500}
.sec{margin-top:16px}
.q{position:relative;overflow:hidden}.q .ql{font-size:12.5px;color:var(--mut);font-weight:600}.q .qa{font-size:24px;font-weight:700;margin:4px 0 2px;letter-spacing:-.5px}
.q .qs{color:var(--mut);font-size:12.5px}.q::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--idle))}
.big{font-size:26px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}.mid{font-size:18px;font-weight:700}
.mut{color:var(--mut)}.dim{color:var(--dim)}.sm{font-size:12.5px}.xs{font-size:11.5px}
.pos{color:var(--ok)}.neg{color:var(--fail)}.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-fail{color:var(--fail)}.c-idle{color:var(--idle)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--idle);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.fail{background:var(--fail);box-shadow:0 0 0 3px rgba(239,68,68,.2)}.dot.idle{background:var(--idle)}.dot.na{background:transparent;border:1px solid var(--dim)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:20px;padding:2px 10px;font-size:12px;background:var(--panel2);white-space:nowrap}
.chip.bull{border-color:rgba(34,197,94,.45);color:#86efac}.chip.bear{border-color:rgba(239,68,68,.5);color:#fca5a5}.chip.warn{border-color:rgba(245,158,11,.5);color:#fcd34d}
.sev{font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;color:#fff;flex:none}.sev.P1{background:var(--p1)}.sev.P2{background:var(--p2);color:#1a1200}.sev.P3{background:#2b4a75}.sev.P4{background:#334155}
.issue{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.issue:first-child{border-top:0;padding-top:2px}
.issue .t{font-weight:600}.issue .d{color:var(--mut);font-size:12.5px}.issue .a{margin-left:auto;display:flex;gap:6px;flex:none;align-items:center}
.issue.acked{opacity:.6}
.lvls{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:12.5px;margin-top:10px}
.lvls .k{color:var(--mut);display:flex;align-items:center;gap:7px}
.app-hd{display:flex;align-items:center;gap:9px}.app-hd b{font-size:15px}.app-hd .r{margin-left:auto}
table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--mut);font-weight:600;text-align:left;font-size:12px;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid #1f2733;vertical-align:top}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.bar{height:8px;background:var(--panel2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}.bar i{display:block;height:100%;background:var(--ok)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}.kv .k{color:var(--mut)}
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}.flow .s{flex:1;min-width:62px;text-align:center;padding:8px 4px;border:1px solid var(--line);background:var(--panel2);margin-right:-1px}
.flow .s:first-child{border-radius:8px 0 0 8px}.flow .s:last-child{border-radius:0 8px 8px 0}.flow .s b{display:block;font-size:18px;font-variant-numeric:tabular-nums}.flow .s span{font-size:11.5px;color:var(--mut)}
.ev{display:grid;grid-template-columns:88px 54px 36px 1fr;gap:8px;padding:7px 0;border-top:1px solid #1f2733;font-size:12.5px;align-items:start}.ev:first-child{border-top:0}
.ev .m{white-space:pre-wrap;word-break:break-word}
.tag{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.empty{color:var(--dim);padding:8px 0}.note{color:var(--mut);font-size:12px;margin-top:10px}
.secbar{display:flex;gap:4px;flex-wrap:wrap}.secbar .sb{flex:1 1 80px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px}
.secbar .sb b{display:block;font-size:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.filters .btn.on{border-color:var(--blue);color:var(--blue)}
.banner{border:1px solid rgba(239,68,68,.5);background:rgba(239,68,68,.08);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.ok-banner{border:1px solid rgba(34,197,94,.4);background:rgba(34,197,94,.07);border-radius:10px;padding:12px 14px}
pre.rep{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12.5px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid var(--line);padding:9px 16px;border-radius:8px;display:none;z-index:9}
.loading{color:var(--mut);padding:40px;text-align:center}
</style>
</head>
<body>
<header>
  <div class="hd">
    <h1>Global Trading Control Center<small>미국 주식 5대 전략 통합 운영 대시보드 (Jones · Ross · Kell · MA20·60 · V5) · 조회·경보 전용</small></h1>
    <div class="sp"></div>
    <div class="clock" id="clock"></div>
    <button class="btn" id="refresh">↻ 새로고침</button>
  </div>
  <nav id="nav">
    <a href="#overview" data-t="overview">Overview</a>
    <a href="#market" data-t="market">Market · Jones</a>
    <a href="#strategies" data-t="strategies">Strategies</a>
    <a href="#risk" data-t="risk">Portfolio &amp; Risk</a>
    <a href="#events" data-t="events">Events &amp; Health</a>
    <a href="#reports" data-t="reports">Reports</a>
  </nav>
</header>
<main id="main"><div class="loading">세 웹앱 상태를 수집하는 중…</div></main>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
let S = null, EV = null, TAB = 'overview', REPSEL = null;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LVN = {ok:'정상', warn:'주의', fail:'장애', idle:'대기', na:'해당 없음'};
const LVK = {server:'서버', data:'데이터', analysis:'분석', trade:'거래'};
const f = (v, d = 2) => v == null || v === '' || Number.isNaN(+v) ? '—' : (+v).toLocaleString('en-US', {minimumFractionDigits: d, maximumFractionDigits: d});
const usd = (v, sign = true) => v == null ? '<span class="dim">—</span>' : `<span class="${+v > 0 ? 'pos' : +v < 0 ? 'neg' : ''}">${sign && +v > 0 ? '+' : ''}${+v < 0 ? '-' : ''}$${f(Math.abs(+v))}</span>`;
const pct = (v, d = 1, sign = true) => v == null ? '—' : `${sign && +v > 0 ? '+' : ''}${f(v, d)}%`;
const tm = iso => { if (!iso) return '—'; const d = new Date(iso); return d.toLocaleString('ko-KR', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:false}); };
const ago = iso => { if (!iso) return ''; const s = (Date.now() - new Date(iso)) / 1000; return s < 90 ? `${Math.round(s)}초 전` : s < 5400 ? `${Math.round(s / 60)}분 전` : s < 172800 ? `${Math.round(s / 3600)}시간 전` : `${Math.round(s / 86400)}일 전`; };
const dot = l => `<span class="dot ${l}"></span>`;
const toast = m => { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2600); };
const appName = a => ({JONES:'Jones', ROSS:'Ross', KELL:'Kell', MA:'MA20·60', V5:'V5', DASH:'통합'})[a] || a;
const link = (app, path = '', txt = '원본 웹앱 ↗') => S && S.apps[app] ? `<a href="${esc(S.apps[app].url + path)}" target="_blank" rel="noopener">${txt}</a>` : '';

async function api(p, o = {}) {
  const r = await fetch(p, {headers: {'Content-Type': 'application/json'}, ...o});
  if (r.status === 401) { location.href = '/login'; throw new Error('login'); }
  if (!r.ok) throw new Error((await r.text()).slice(0, 200));
  return r.json();
}
async function load(force) {
  if (force) { try { await api('/api/refresh', {method: 'POST'}); } catch (e) {} }
  S = await api('/api/snapshot');
  try { EV = await api('/api/events?sev=P3&limit=200'); } catch (e) { EV = {rows: []}; }
  render();
}
function header() {
  const c = S.ctx;
  const now = new Date();
  $('#clock').innerHTML = `<b>${c.phase_name}</b> · 뉴욕 ${esc(c.et.slice(5))} ET · 현지 ${now.toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit', hour12:false})}<br>
    <span class="xs">기준 거래일 ${c.basis} · 수집 ${ago(S.built_at)} (${S.took_ms}ms) ${S.errors && S.errors.length ? '<span class="c-warn">· 수집 경고 ' + S.errors.length + '</span>' : ''}</span>`;
  const open = (S.issues || []).filter(i => ['P1', 'P2'].includes(i.severity) && i.state !== 'acked').length;
  document.querySelectorAll('#nav a').forEach(a => {
    a.classList.toggle('on', a.dataset.t === TAB);
    if (a.dataset.t === 'overview') a.innerHTML = 'Overview' + (open ? `<span class="cnt">${open}</span>` : '');
  });
}
function render() {
  if (!S || !S.ready) { $('#main').innerHTML = '<div class="loading">수집 대기 중…</div>'; return; }
  header();
  const v = {overview, market, strategies, risk, events, reports}[TAB] || overview;
  $('#main').innerHTML = v();
  if (TAB === 'reports') loadReports();
}

// ─────────────────────────────── Overview
function issueList(list, full) {
  if (!list.length) return `<div class="ok-banner">✅ <b>지금 조치할 문제가 없습니다.</b> <span class="mut sm">정상 항목은 숫자로만 요약합니다.</span></div>`;
  return list.map(i => `<div class="issue ${i.state === 'acked' ? 'acked' : ''}"><span class="sev ${i.severity}">${i.severity}</span>
    <div><div class="t">${esc(i.title)} <span class="tag">${appName(i.app)}</span></div>
    <div class="d">${esc(i.detail || '')}${i.first_seen ? ` · 발생 ${tm(i.first_seen)} (${ago(i.first_seen)})` : ''}${i.state === 'acked' ? ' · <b>확인함</b>' : ''}${full && i.notified ? ` · 통보 ${esc(i.notified)}` : ''}${i.notify_err && i.notify_err !== 'NTFY_TOPIC 미설정' ? ` · <span class="c-warn">통보 실패 ${esc(i.notify_err)}</span>` : ''}</div></div>
    <div class="a">${i.link ? `<a class="btn sm" href="${esc(i.link)}" target="_blank" rel="noopener">열기 ↗</a>` : ''}${i.state !== 'acked' && ['P1','P2'].includes(i.severity) ? `<button class="btn sm" data-ack="${esc(i.key)}">확인</button>` : ''}</div></div>`).join('');
}
function overview() {
  const J = S.jones, R = S.ross, K = S.kell, M = S.ma || {}, V = S.v5 || {}, Rk = S.risk, m = J.market || {};
  const iss = S.issues || [];
  const act = iss.filter(i => ['P1', 'P2'].includes(i.severity));
  const rev = iss.filter(i => !['P1', 'P2'].includes(i.severity));
  const tone = m.risk == null ? 'idle' : m.risk <= 1 ? 'ok' : m.risk <= 3 ? 'warn' : 'fail';
  const sysL = [R.overall, K.overall, M.overall, V.overall, J.overall].filter(Boolean);
  const sysW = sysL.includes('fail') ? 'fail' : sysL.includes('warn') ? 'warn' : 'ok';
  const p1 = act.filter(i => i.severity === 'P1' && i.state !== 'acked').length;
  const q = (lbl, c, a, s) => `<div class="card q" style="--c:var(--${c})"><div class="ql">${lbl}</div><div class="qa c-${c}">${a}</div><div class="qs">${s}</div></div>`;
  const idx = ['SPY', 'QQQ', 'IWM'].map(s => { const x = (m.indexes || {})[s]; return x ? `<div><div class="xs mut">${s}</div><span class="chip ${x.tone}">${esc(x.label)}</span><div class="xs dim" style="margin-top:3px">200일선 ${pct(x.gap200)}</div></div>` : ''; }).join('');
  const appCard = A => { const a = S[A.toLowerCase()], ap = S.apps[A];
    return `<div class="card"><div class="app-hd">${dot(a.overall)}<b>${ap.short}</b><span class="mut sm">${esc(ap.role)}</span><span class="r">${link(A, '', '↗')}</span></div>
      <div class="sm" style="margin-top:8px">${esc(a.headline || '')}</div>
      ${brokerLine(A)}
      <div class="lvls">${Object.entries(a.status).map(([k, v]) => `<span class="k">${dot(v.level)}${LVK[k]}</span><span class="${v.level === 'fail' ? 'c-fail' : v.level === 'warn' ? 'c-warn' : ''}">${esc(v.text)}</span>`).join('')}</div></div>`; };
  const ll = Rk.loss_limit || {};
  const evs = (EV.rows || []).filter(e => e.severity <= 'P3' && e.kind !== '서버 시작').slice(0, 9);
  return `
  <div class="grid g3">
    ${q('현재 시장은 안전한가?', tone, m.stage ? `${esc(m.stage)} · ${m.risk <= 1 ? '안전' : m.risk <= 3 ? '주의' : '위험'}` : '판정 없음', m.name ? `${esc(m.name)} · 전일 대비 <b>${esc(m.change)}</b>` : '')}
    ${q('매매 시스템은 정상인가?', sysW, sysW === 'ok' ? '정상' : sysW === 'warn' ? '점검 필요' : '장애', `Ross ${LVN[R.overall]} · Kell ${LVN[K.overall]} · MA ${LVN[M.overall] || '—'} · V5 ${LVN[V.overall] || '—'} · Jones ${LVN[J.overall]}`)}
    ${q('지금 조치할 문제가 있는가?', p1 ? 'fail' : act.length ? 'warn' : 'ok', act.length ? `${act.length}건` + (p1 ? ` (긴급 ${p1})` : '') : '없음', `검토 사항 ${rev.length}건 · 미확인 주문 ${Rk.unknown_orders}건 · 데이터 경고 ${Rk.data_warnings}건`)}
  </div>
  <div class="card sec"><h2>⚠ 조치 필요 <span class="r xs">P1 긴급 · P2 중요 — [확인]은 관리자 확인 기록(알림 발송 ≠ 확인)</span></h2>${issueList(act)}
    ${rev.length ? `<details style="margin-top:10px"><summary class="mut sm" style="cursor:pointer">검토 사항 ${rev.length}건 (P3)</summary>${issueList(rev)}</details>` : ''}</div>
  <div class="grid g2 sec">
    <div class="card"><h2><span class="no">01</span> Jones 시장 판단 <span class="r">${link('JONES', '/#market')}</span></h2>
      <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
        <div><div class="big c-${tone}">${esc(m.stage || '—')}</div><div class="sm">${esc(m.name || '')}</div></div>
        <div style="display:flex;gap:16px;flex-wrap:wrap">${idx}</div></div>
      <div class="sm" style="margin-top:12px"><b>${esc(m.trend_long || '')}</b> / ${esc(m.early_warning || '')} · 같은 국면 ${m.streak || 0}일째 ${m.defense ? '· <span class="c-fail">방어 국면</span>' : ''}</div>
      <div class="sm mut">시장 변화: 전일 대비 <b>${esc(m.change || '—')}</b> · 신규 발굴 후보 ${J.discover.new ?? '—'}개 (전체 ${J.discover.n}) · 기준일 ${m.d || '—'}</div>
      ${J.etf ? `<div class="sm" style="margin-top:8px;border-top:1px solid var(--line);padding-top:8px">ETF 200일 엔진 <span class="tag">${esc(J.etf.mode_name)}</span> · 보유 ${J.etf.positions.length}/${(J.etf.etfs || []).length} · 예산 $${f(J.etf.budget, 0)}
        ${(J.etf.paper || []).length ? `<span class="mut"> · 가상 운용 ${J.etf.paper.map(a => `${esc((a.name || a.key).split(' ')[0])} ${pct(a.ret_pct, 2)}`).join(' / ')}</span>` : ''}</div>` : ''}</div>
    <div class="card"><h2><span class="no">03</span> 거래 성과 <span class="r xs mut">기준 거래일 ${R.basis}</span></h2>
      <div class="grid g4">
        <div><div class="sm mut">Ross 당일 실현손익</div><div class="big">${usd(R.day_pnl)}</div>
          <div class="sm mut">${R.day.n || 0}회 청산 · 승률 ${R.day.n ? R.day.win_rate + '%' : '—'} · 신호 ${R.funnel.signals ?? '—'} → 체결 ${R.funnel.fills ?? 0}</div></div>
        <div><div class="sm mut">Kell 당일 실현 <span class="tag">${esc(K.mode_name)}</span></div><div class="big">${usd(K.day_realized)}</div>
          <div class="sm mut">평가손익 ${usd(K.unrealized)} (별도) · 보유 ${K.positions.length} · 신규 ${K.funnel.entries}</div></div>
        <div><div class="sm mut">MA20·60 당일 실현 <span class="tag">${esc(M.mode_name || '—')}</span></div><div class="big">${usd(M.day_realized)}</div>
          <div class="sm mut">평가손익 ${M.unrealized != null ? usd(M.unrealized) : '<span class="dim">연동 필요</span>'} (별도) · 보유 ${(M.positions || []).length} · 진입 대기 ${((M.funnel || {}).watch_live || 0) + ((M.funnel || {}).watch_paper || 0)}</div></div>
        <div><div class="sm mut">V5 당일 실현 <span class="tag">${esc(V.unlinked ? '미연결' : (V.kis ? 'KIS 모의' : '가상'))}</span></div><div class="big">${V.unlinked ? '<span class="dim">—</span>' : usd(V.day_realized)}</div>

function evList(rows) {
  if (!rows.length) return '<div class="empty">이벤트 없음</div>';

}

// ─────────────────────────────── Strategies
function strategies() {
  const R = S.ross, K = S.kell, J = S.jones, M = S.ma || {}, V5 = S.v5 || {}, vc = V5.cum || {}, E = J.etf || {}, rc = R.cum || {}, kc = K.cum || {}, mc = M.cum || {}, ec = E.cum || {}, MF = M.funnel || {};
  const hold = s => s == null ? '—' : s < 3600 ? `${Math.round(s / 60)}분` : s < 86400 ? `${f(s / 3600, 1)}시간` : `${f(s / 86400, 1)}일`;
  const rowsCmp = [
    ['당일 청산', R.day.n || 0, K.funnel.closed, MF.closed ?? 0, '—', V5.unlinked ? '—' : ((V5.report?.today && Object.values(V5.report.today).reduce((a, x) => a + (x.n || 0), 0)) ?? 0)],
    ['신규 진입(체결)', R.funnel.fills ?? 0, K.funnel.entries, MF.entries ?? 0, '—', '—'],

    ['누적 청산 거래', rc.n || 0, kc.n || 0, mc.n || 0, ec.n || 0, vc.n || 0],
    ['승률', rc.n ? rc.win_rate + '%' : '—', kc.n ? kc.win_rate + '%' : '—', mc.n ? mc.win_rate + '%' : '—', ec.n ? ec.win_rate + '%' : '—', vc.n ? vc.win_rate + '%' : '—'],
    ['실현 순손익(누적)', usd(rc.net), usd(kc.net), usd(mc.net), usd(ec.net), usd(vc.net)],
    ['미실현 평가손익', '<span class="mut">당일 청산 원칙</span>', usd(K.unrealized), M.unrealized != null ? usd(M.unrealized) + (M.unreal_src && M.unreal_src !== '실시간' ? `<div class="xs dim">${esc(M.unreal_src)}</div>` : '') : '<span class="dim">연동 필요</span>', '<span class="dim">앱에서 확인</span>', '<span class="dim">앱에서 확인</span>'],
    ['Profit Factor', rc.pf ?? '—', kc.pf ?? '—', mc.pf ?? '—', ec.pf ?? '—', vc.pf ?? '—'],
    ['거래당 기대손익', usd(rc.expectancy), usd(kc.expectancy), usd(mc.expectancy), usd(ec.expectancy), usd(vc.expectancy)],
    ['평균 R', rc.avg_r ?? '—', kc.avg_r ?? '—', mc.avg_r != null ? f(mc.avg_r) : '—', ec.avg_r ?? '—', vc.avg_r ?? '—'],
    ['최대낙폭', usd(rc.mdd), usd(kc.mdd), usd(mc.mdd), usd(ec.mdd), usd(vc.mdd)],
    ['누적수익률(자본 대비)', rc.ret_pct != null ? pct(rc.ret_pct, 2) : '—', kc.ret_pct != null ? pct(kc.ret_pct, 2) : '—', mc.ret_pct != null ? pct(mc.ret_pct, 2) : '—', ec.ret_pct != null ? pct(ec.ret_pct, 2) : '—', vc.ret_pct != null ? pct(vc.ret_pct, 2) : '—'],
    ['주문 실패율', R.order_fail_rate != null ? R.order_fail_rate + '% (' + R.orders_submitted + '건 중)' : '—', '—', '—', E.orders14 ? `가드 차단 ${E.orders14.fail} / ${E.orders14.ok + E.orders14.fail}건(14일)` : '—', '—'],
    ['평균 보유기간', hold(rc.avg_hold_s), kc.avg_hold_days != null ? kc.avg_hold_days + '일' : '—', mc.avg_hold_days != null ? mc.avg_hold_days + '일' : '—', ec.avg_hold_days != null ? ec.avg_hold_days + '일' : '—', vc.avg_hold_days != null ? vc.avg_hold_days + '일' : '—'],
  ];

  const tr = R.trial;

  <div class="grid g2 sec">

// Ross 실매매 로직·그림자 라인·목표·토스 응답 (2026-11-25 Ross V2.0α-L / S1.1.0)
function rossLogic(R) {
  const L = R.logic || {}, sh = R.shadow || {}, bl = R.by_logic || {}, tg = R.targets || {}, tm_ = R.targets_meta, rt = R.toss_rtt;
  const pr = (p) => p && p.n ? `${p.n}건 · 승률 ${p.win_rate}% · ${usd(p.net)}${p.pf != null ? ' · PF ' + p.pf : ''}` : '<span class="dim">청산 없음</span>';
  const rows = [[`<b>실매매</b> · ${esc(L.name || '로스 단타')}`, (bl[L.mode] || {}).day, (bl[L.mode] || {}).cum],
                [`그림자(가상) · ${esc(sh.name || '—')}`, sh.day, sh.cum]];
  const per = {week: '이번 주', month: '이번 달', year: '올해'};
  return `<h2 style="margin-top:14px">실매매 로직 · 그림자 라인 비교 <span class="r xs">실매매 로직 ${esc(L.name || '로스 단타')}${L.since ? ' · ' + tm(L.since) + ' 전환' : ''}</span></h2>
    <div class="tw"><table><tr><th>라인</th><th class="n">오늘</th><th class="n">누적</th></tr>
    ${rows.map(r => `<tr><td>${r[0]}</td><td class="n sm">${pr(r[1])}</td><td class="n sm">${pr(r[2])}</td></tr>`).join('')}</table></div>
    ${Object.keys(bl).length > 1 ? `<div class="sm mut" style="margin-top:6px">실매매 누적(로직별): ${Object.values(bl).map(x => esc(x.name) + ' ' + pr(x.cum)).join(' · ')}</div>` : ''}
    <div class="note">그림자 라인은 같은 종목·시세로 반대 로직을 가상 매매한 결과이며 주문을 내지 않습니다. 실매매 손익·손실한도에는 포함하지 않습니다${sh.since ? ' (기록 시작 ' + esc(sh.since) + ')' : ''}.</div>
    ${Object.keys(tg).length ? `<h2 style="margin-top:14px">수익 목표 진행 <span class="r xs">${tm_ ? esc(tm_.period || '') + ' 검토 기준' : ''}</span></h2>
      <div class="tw"><table><tr><th>기간</th><th class="n">목표</th><th class="n">실현</th><th class="n">달성</th><th class="n">남은 거래일 · 하루 필요</th></tr>
      ${Object.entries(tg).map(([k, t]) => `<tr><td>${per[k] || k}</td><td class="n">${t.target_pct ?? '—'}% (${usd(t.target_usd)})</td><td class="n">${usd(t.pnl)} (${pct(t.ret_pct, 2)})</td><td class="n">${t.achv_pct != null ? t.achv_pct + '%' : '—'}</td><td class="n">${t.days_left ?? '—'}일 · ${usd(t.need_per_day)}</td></tr>`).join('')}</table></div>
      <div class="note">수익 목표는 도전 목표이며 달성 보장이 아닙니다.</div>` : ''}
    <div class="sm" style="margin-top:10px"><b>토스 API 응답</b> ${rt ? `${dot(rt.net_errors_5m >= 3 ? 'fail' : (rt.p95 > 1500 || (rt.order_p95 || 0) > 1500 || rt.net_errors_5m) ? 'warn' : rt.n ? 'ok' : 'idle')} ${esc(rt.text)}${rt.last_ms != null ? ` <span class="mut">· 마지막 ${esc(rt.last_kind || '')} ${rt.last_ms}ms (${Math.round(rt.last_age_s)}초 전)</span>` : ''}` : '<span class="dim">미수신</span>'}</div>`;
}

}

function reports() {

    <div class="card" id="repbody"><div class="loading">보고서를 선택하세요</div></div></div>`;
}
async function loadReports() {
  let list = {rows: []};
  try { list = await api('/api/reports'); } catch (e) {}
  $('#replist').innerHTML = `<div class="issue" style="cursor:pointer" data-rep="live"><b>실시간 초안</b><span class="a tag">${S.ctx.basis}</span></div>` +
    list.rows.map(r => `<div class="issue" style="cursor:pointer" data-rep="${r.d}"><span>${r.d}</span><span class="a"><span class="tag">${esc(r.status)}</span></span></div>`).join('');
  showReport(REPSEL || (list.rows[0] ? list.rows[0].d : 'live'));
}
async function showReport(d) {
  REPSEL = d;
  const r = await api(d === 'live' ? '/api/reports/live' : '/api/reports/' + d);
  const v = (x, fn = y => y) => x == null ? '<span class="c-warn">미수신</span>' : fn(x);
  const J = r.jones, Ro = r.ross, Ke = r.kell, Ri = r.risk;
  $('#repbody').innerHTML = `<h2>미국 주식 통합 운영보고서 · ${r.date} <span class="tag">${esc(r.status)}</span>${r.built_at ? `<span class="r xs">작성 ${tm(r.built_at)} · ${esc(r.sent || '미발송')}</span>` : ''}</h2>
    <div class="secbar" style="margin-bottom:12px">${Object.entries(r.conditions).map(([k, ok]) => `<div class="sb">${dot(ok ? 'ok' : 'warn')} ${esc(k)}</div>`).join('')}</div>
    <div class="grid g2">
      <div><div class="mid">1. 시장 분석 — Jones</div><div class="kv" style="margin-top:6px"><span class="k">현재 시장 단계</span><span>${v(J.stage)} · ${esc(J.name || '')}</span>
        <span class="k">전일 대비</span><span>${v(J.change)}</span><span class="k">신규 종목 발굴</span><span>${v(J.new_candidates)}개 (전체 ${v(J.candidates)})</span><span class="k">시장 경보</span><span>${J.warnings}건</span></div></div>
      <div><div class="mid">2. 단타 실매매 — Ross</div><div class="kv" style="margin-top:6px"><span class="k">청산 완료 거래</span><span>${v(Ro.closed)}건</span><span class="k">승률</span><span>${Ro.win_rate != null ? Ro.win_rate + '%' : '—'}</span>
        <span class="k">실현 순손익</span><span>${v(Ro.realized, usd)}</span><span class="k">미확인 주문</span><span>${Ro.unknown_orders}건</span><span class="k">누적</span><span>${Ro.cum_n || 0}건 · ${usd(Ro.cum_net)}</span></div></div>
      <div><div class="mid">3. 수일 매매 — Kell (${esc(Ke.mode)})</div><div class="kv" style="margin-top:6px"><span class="k">보유 종목</span><span>${Ke.holdings}개</span><span class="k">신규 진입</span><span>${v(Ke.entries)}건</span>
        <span class="k">실현 순손익</span><span>${v(Ke.realized, usd)}</span><span class="k">평가손익</span><span>${v(Ke.unrealized, usd)}</span><span class="k">다음 감시</span><span>${v(Ke.watch_live)}종목 (스캔 ${esc(Ke.scan_as_of || '—')})</span></div></div>
      ${r.jones_etf ? `<div><div class="mid">1b. ETF 200일 운용 — Jones E (${esc(r.jones_etf.mode || '—')})</div><div class="kv" style="margin-top:6px"><span class="k">보유</span><span>${r.jones_etf.holdings}개</span>
        <span class="k">실현 순손익</span><span>${v(r.jones_etf.realized, usd)}</span><span class="k">장 마감 점검 이상</span><span>${(r.jones_etf.bad_checks || []).length ? r.jones_etf.bad_checks.map(esc).join(', ') : '없음'}</span>
        <span class="k">가상 운용 A·B·C</span><span>${(r.jones_etf.paper || []).map(a => esc((a.name || '').split(' ')[0]) + ' ' + pct(a.ret_pct, 2)).join(' / ') || '—'}</span></div></div>` : ''}
      ${r.ma ? `<div><div class="mid">3b. 추세 매매 — MA20·60 (${esc(r.ma.mode || '—')})</div><div class="kv" style="margin-top:6px"><span class="k">보유 종목</span><span>${r.ma.holdings}개</span><span class="k">신규 진입</span><span>${v(r.ma.entries)}건</span>
        <span class="k">실현 순손익</span><span>${v(r.ma.realized, usd)}</span><span class="k">평가손익</span><span>${v(r.ma.unrealized, usd)}</span><span class="k">신호 / 매수 가능</span><span>${v(r.ma.signals)} / ${v(r.ma.buyable)} · 진입 대기 ${r.ma.watch}종목</span>
        <span class="k">과거 검증 승인</span><span>${Object.entries(r.ma.research_pass || {}).map(([k, p]) => k + (p ? ' 통과' : ' 미통과')).join(' · ') || '—'}</span></div></div>` : ''}
      ${r.v5 ? `<div><div class="mid">3c. 통합 자동매매 — V5 (${esc(r.v5.mode || '—')})</div>${r.v5.unlinked ? '<div class="sm c-warn" style="margin-top:6px">데이터 미연결 — V5_DATABASE_URL 입력 필요</div>' : `<div class="kv" style="margin-top:6px"><span class="k">시장 환경</span><span>${esc(r.v5.regime || '—')}</span>
        <span class="k">보유 / 실현</span><span>${r.v5.holdings}개 · ${v(r.v5.realized, usd)}</span><span class="k">다음 거래일 후보</span><span>${Object.entries(r.v5.cands || {}).map(([k, n]) => k + ' ' + n).join(' · ') || '없음'}</span>
        <span class="k">안전장치 이상</span><span>${(r.v5.bad_checks || []).length ? r.v5.bad_checks.map(esc).join(', ') : '없음'}</span></div>`}</div>` : ''}
      <div><div class="mid">4. 전체 투자위험</div><div class="kv" style="margin-top:6px"><span class="k">합산 실현 순손익(실매매)</span><span>${v(Ri.realized_total_live, usd)}</span><span class="k">현재 미실현 평가손익</span><span>${v(Ri.unreal_all ?? Ri.unreal_kell, usd)}</span>
        <span class="k">손실한도 초과</span><span>${Ri.loss_limit_breach}건</span><span class="k">운영 장애</span><span>미해결 ${Ri.incidents_open} · 해제 ${Ri.incidents_resolved}</span></div></div>
    </div>
    <div class="mid" style="margin-top:14px">5. 다음 거래일 관리사항</div><ul style="margin:6px 0 0;padding-left:18px">${r.next.map(n => `<li>${esc(n)}</li>`).join('')}</ul>
    <div class="note">${esc(r.note)}</div>
    <details style="margin-top:10px"><summary class="mut sm" style="cursor:pointer">ntfy 발송 문안</summary><pre class="rep">${esc(r.text || '')}</pre></details>`;
  document.querySelectorAll('[data-rep]').forEach(x => x.style.background = x.dataset.rep === d ? 'var(--panel2)' : '');
}

// ─────────────────────────────── 이벤트 바인딩
document.addEventListener('click', async e => {
  const a = e.target.closest('[data-ack]');
  if (a) { a.disabled = true; try { await api('/api/issues/ack', {method: 'POST', body: JSON.stringify({key: a.dataset.ack})}); toast('확인 처리했습니다'); await load(); } catch (er) { toast('실패: ' + er.message); } return; }
  const fv = e.target.closest('[data-evf]');
  if (fv) { const [k, v] = fv.dataset.evf.split(':'); EVF[k] = v; render(); return; }
  const rp = e.target.closest('[data-rep]');
  if (rp) { showReport(rp.dataset.rep); return; }
  if (e.target.id === 'ntfyTest') { const r = await api('/api/notify/test', {method: 'POST'}); toast(r.ok ? 'ntfy 발송 성공' : '실패: ' + r.err); }
});
$('#refresh').onclick = async () => { $('#refresh').disabled = true; try { await load(true); toast('갱신됨'); } finally { $('#refresh').disabled = false; } };
function route() { TAB = location.hash.slice(1) || 'overview'; if (S) render(); }
window.addEventListener('hashchange', route);
route();
load().catch(e => $('#main').innerHTML = `<div class="card">불러오기 실패: ${esc(e.message)}</div>`);
setInterval(() => { if (!document.hidden && TAB !== 'reports') load().catch(() => {}); }, 60000);
setInterval(() => { if (S) header(); }, 15000);
</script>
</body>
</html>
